services:
  marketplace.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: marketplace_db
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Marketplace_SA_Pass123!
    ports:
      - "14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Marketplace_SA_Pass123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  marketplace.redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    ports:
      - "6379:6379"

  marketplace.seq:
    image: datalust/seq:latest
    container_name: marketplace_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"

  marketplace.api:
    image: marketplace-api
    container_name: marketplace_api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=marketplace.db,1433;Database=MarketplaceDb;User Id=sa;Password=Marketplace_SA_Pass123!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=marketplace.redis:6379
      - JwtSettings__SecretKey=SuperSecretKeyForMarketplaceSecurityService2026!
      - JwtSettings__Issuer=MarketplaceAPI
      - JwtSettings__Audience=MarketplaceClients
      - JwtSettings__ExpiryMinutes=15
      - Seq__ServerUrl=http://marketplace.seq:80
    ports:
      - "8085:8080"
    volumes:
      - ./uploads:/app/wwwroot/uploads
    depends_on:
      marketplace.db:
        condition: service_healthy
      marketplace.redis:
        condition: service_started
      marketplace.seq:
        condition: service_started

  marketplace.web:
    image: nextjs-web-dev
    container_name: marketplace_web
    build:
      context: ../nextjs-frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../nextjs-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8085/api/v1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: ["npx", "next", "dev", "-p", "3001", "-H", "0.0.0.0", "--webpack"]
    ports:
      - "4000:3001"
    depends_on:
      - marketplace.api

volumes:
  sqlserver_data:
